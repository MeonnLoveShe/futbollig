<script>
const DEF=()=>({cfg:{win:3,draw:1,start:1000,iF:10,iG:25,iP:50},n:1,players:['Andi','Budi','Citra','Dedi','Eka'],sched:null,po:null,de:null,fmt:'grp',fr:[],rankOn:true,lk:{},hist:[],tab:'start'});
let S=DEF();
try{const x=localStorage.getItem('fsl2');if(x)S=Object.assign(DEF(),JSON.parse(x))}catch(e){}
S.cfg=Object.assign(DEF().cfg,S.cfg);S.op={};S.tab='start';
const $=id=>document.getElementById(id);
let LITE=false;try{LITE=localStorage.getItem('fsl_lite')==='1'}catch(e){}
const applyLite=()=>document.body.classList.toggle('lite',LITE);
function tgLite(){LITE=!LITE;try{localStorage.setItem('fsl_lite',LITE?'1':'0')}catch(e){}applyLite();menu()}
let ref=null,USER=null,AR=false,GUEST=false,FLAT=false;const uname=u=>((u&&u.email)||"").split("@")[0].toLowerCase();const can=()=>!ref||!!USER;
const FB={apiKey:"AIzaSyDj6mRlOV6dQZaLBnxRmQsEg46DmBKdqnE",authDomain:"futbol-lig-l-tour.firebaseapp.com",projectId:"futbol-lig-l-tour"};
const save=()=>{try{localStorage.setItem('fsl2',JSON.stringify(S))}catch(e){}
if(ref&&can()){const d={...S};delete d.op;delete d.tab;ref.set({json:JSON.stringify(d),t:Date.now()}).catch(()=>{})}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=i=>esc(S.players[i]??'?');
const sd=n=>(n>0?'+':'')+n.toFixed(2);
const lk=k=>!!S.lk[k];
function dt(key,title,body,def){if(FLAT)return `<div class="c${/^(gs|r1|hh)$/.test(key)?' full':''}"><h3 class="bt">${title}</h3><div class="bd">${body}</div></div>`;return `<details class="c" ${(S.op[key]??def)?'open':''} ontoggle="S.op['${key}']=this.open"><summary>${title}</summary><div>${body}</div></details>`}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gen(){let t=shuffle(S.players.map((_,i)=>i));if(t.length%2)t.push(-1);const n=t.length,R=[];
 for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a>=0&&b>=0)m.push({a,b,sa:'',sb:''})}R.push(m);t.splice(1,0,t.pop())}
 S.sched=shuffle(R).map(shuffle);S.po=null;S.lk={};S.op={}}
function stand(){const T=S.players.map((n,i)=>({i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
 (S.sched||[]).flat().forEach(m=>{if(m.sa===''||m.sb==='')return;const a=T[m.a],b=T[m.b],x=+m.sa,y=+m.sb;a.p++;b.p++;a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;
 if(x>y){a.w++;b.l++;a.pts+=S.cfg.win}else if(x<y){b.w++;a.l++;b.pts+=S.cfg.win}else{a.d++;b.d++;a.pts+=S.cfg.draw;b.pts+=S.cfg.draw}});
 return T.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.i-b.i)}
function win(m){if(!m||m.sa===''||m.sb===''||m.a==null||m.b==null)return null;const x=+m.sa,y=+m.sb;return x>y?m.a:x<y?m.b:m.pen==='a'?m.a:m.pen==='b'?m.b:null}
function lose(m){const w=win(m);return w==null?null:w===m.a?m.b:m.a}
function mkPO(){const s=stand().slice(0,4).map(x=>x.i),e=()=>({sa:'',sb:'',pen:''});
 S.po={s:[{a:s[0],b:s[3],...e()},{a:s[1],b:s[2],...e()}],t:e(),f:e()};S.lk={...S.lk,s:false,t:false,f:false};S.op={}}
function syncPO(z){const P=z.po;if(!P)return;P.t.a=lose(P.s[0]);P.t.b=lose(P.s[1]);P.f.a=win(P.s[0]);P.f.b=win(P.s[1])}
function batches(z){const B=[],P=z.po,nm=m=>({...m,a:z.players[m.a],b:z.players[m.b]}),ok=m=>m.a!=null&&m.b!=null&&m.sa!==''&&m.sb!=='';
 (z.sched||[]).forEach(r=>{const b=r.filter(ok).map(m=>({...nm(m),src:'g'}));if(b.length)B.push(b)});
 if(P){const s=P.s.filter(ok).map(m=>({...nm(m),src:'p'}));if(s.length)B.push(s);const f=[P.t,P.f].filter(ok).map(m=>({...nm(m),src:'p'}));if(f.length)B.push(f)}
 if(z.de){const {ev}=deEval(z),by={};z.de.ms.forEach(m=>{const e=ev(m.id);if(typeof e.A==='number'&&typeof e.B==='number'&&m.sa!==''&&m.sb!=='')(by[e.d]=by[e.d]||[]).push({...nm({a:e.A,b:e.B,sa:m.sa,sb:m.sb,pen:m.pen}),src:'p'})});Object.keys(by).sort((x,y)=>x-y).forEach(d=>B.push(by[d]))}
 (z.fr||[]).forEach((f,i)=>B.push([{...nm(f),src:'f',idx:i}]));return B}
const We=d=>1/(Math.pow(10,-d/600)+1);
function ratings(){const R={},log=[],c=S.cfg,get=n=>R[n]??(R[n]=c.start);
 [...S.hist,S].forEach(z=>{z.players.forEach(get);if(!z.rankOn)return;syncPO(z);
  batches(z).forEach(b=>{const D={};
   b.forEach(f=>{const x=+f.sa,y=+f.sb,I=f.src==='f'?c.iF:f.src==='g'?c.iG:c.iP;let Wa=x>y?1:x<y?0:.5,Wb=1-Wa;
    const ea=We(get(f.a)-get(f.b));let da=I*(Wa-ea),db=I*(Wb-(1-ea));
    if(f.src==='p'){if(Wa<Wb)da=Math.max(0,da);if(Wb<Wa)db=Math.max(0,db)}
    D[f.a]=(D[f.a]||0)+da;D[f.b]=(D[f.b]||0)+db;log.push({...f,s:z.n,da,db})});
   for(const n in D)R[n]=get(n)+D[n]})});
 return{R,log}}
function set(path,v){if(!can())return;const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];const l=k[k.length-1];
 o[l]=path.startsWith('cfg.')?(+v):v;save();render()}
function tl(k){S.lk[k]=!S.lk[k];save();render()}
function lockAll(){const ks=(S.fmt==='de'&&S.de?[...new Set(S.de.ms.map(m=>'d'+m.br+m.r))]:(S.sched||[]).map((_,i)=>'md'+i).concat(['s','t','f'])).concat(['fr']),on=!ks.every(lk);ks.forEach(k=>S.lk[k]=on);save();render()}
const lb=k=>`<div class="acts" style="margin:6px 0 0"><button onclick="tl('${k}')">${lk(k)?'Buka kunci':'Kunci skor'}</button></div>`;
function row(m,p,pen,k){const D=(lk(k)||m.a==null||m.b==null)?' disabled':'',tie=pen&&m.sa!==''&&m.sb!==''&&+m.sa===+m.sb;
 return `<div class="m"><span class="t">${m.a==null?'—':N(m.a)}</span><input type="number" min="0" value="${m.sa}"${D} onchange="set('${p}.sa',this.value)"><b>:</b><input type="number" min="0" value="${m.sb}"${D} onchange="set('${p}.sb',this.value)"><span class="t">${m.b==null?'—':N(m.b)}</span>
 ${tie?`<select${D} onchange="set('${p}.pen',this.value)"><option value="">Penalti</option><option value="a" ${m.pen==='a'?'selected':''}>${N(m.a)}</option><option value="b" ${m.pen==='b'?'selected':''}>${N(m.b)}</option></select>`:''}</div>`}
const tabs=()=>ref&&!can()?[['akun','Login'],...(S.fmt==='de'?[['po','Bracket']]:[['group','Klasemen']]),['rank','Ranking'],['hof','Hall of Fame']]:[['start','Start'],['setup','Setup'],...(S.fmt==='de'?[]:[['group','Grup']]),['po',S.fmt==='de'?'Bracket':'Playoffs'],['fr','Friendly'],['rank','Ranking'],['hof','Hall of Fame'],...(ref?[['akun',USER?'Akun':'Login']]:[])];
function render(){
 if(ref&&!AR){$('tabs').innerHTML='';$('app').innerHTML='<div class="c pad">Memuat...</div>';return}
 if(ref&&!USER){const a=$('app');$('tabs').innerHTML=GUEST?`<button class="dd nv" onclick="GUEST=false;render()"><span>Login</span></button>`:'';a.classList.toggle('ro',GUEST);a.innerHTML=GUEST?guest():loginView();anim(GUEST?'g':'l');return}
 if(!tabs().some(t=>t[0]===S.tab))S.tab=tabs()[0][0];
 menu();
 $('app').classList.toggle('ro',!can()&&S.tab!=='akun');
 $('app').innerHTML=({start,setup,group,po,fr,rank,hof,akun})[S.tab]();
 anim(S.tab)}
function anim(k){const a=$('app');if(k!==window._lt){window._lt=k;a.classList.remove('sw');void a.offsetWidth;a.classList.add('sw');clearTimeout(window._st);window._st=setTimeout(()=>a.classList.remove('sw'),900)}}
function loginView(){return `<div class="c" style="padding:22px 18px"><h2 style="font-size:22px;margin:0 0 14px;text-align:center">Login</h2>
 <div class="g" style="grid-template-columns:1fr"><label>Username<input id="le" autocomplete="username" autocapitalize="none"></label><label>Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></label></div>
 <p class="mu" id="lerr" style="color:var(--bad);margin:8px 0 0"></p>
 <div class="acts" style="justify-content:center"><button class="p big nv" onclick="login()">Masuk</button></div>
 <p class="mu" style="text-align:center">Tidak berakun? <a href="#" onclick="GUEST=true;render();return false" style="color:var(--ac)">Pencet ini</a></p></div>`}
function guest(){FLAT=true;try{return '<div class="flat">'+(S.fmt==='de'?de():group())+rank()+'<div class="sec">Hall of Fame</div>'+hof()+'</div>'}finally{FLAT=false}}
function go(t){S.tab=t;window._mo=false;render()}

function menu(){const cur=tabs().find(t=>t[0]===S.tab)[1];
 $('tabs').innerHTML=`<button class="dd${window._mo?' o':''}" onclick="event.stopPropagation();tm()"><span>${cur}</span><i></i></button>`+(window._mo?`<div class="ddm">${tabs().map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}<button onclick="tgLite()">Mode Lite: ${LITE?'On':'Off'}</button></div>`:'')}
document.addEventListener('click',e=>{if(window._mo&&!e.target.closest('.ddm')){window._mo=false;menu()}});
function hofCard(){const H=S.hist.slice().sort((a,b)=>a.n-b.n);
 return `<div class="c hofb" onclick="go('hof')"><span class="sub">Hall of Fame</span>${H.length?H.map(z=>`<div class="hr"><span>S${z.n}</span><b>${esc(z.res[0])}</b></div>`).join(''):'<span class="mu" style="display:block;text-align:center">Belum ada juara</span>'}</div>`}
function start(){const h=S.hist.slice().sort((a,b)=>b.n-a.n)[0],st=S.fmt==='de'?(S.de?'Bracket':'Belum dimulai'):S.po?'Playoffs':S.sched?'Fase grup':'Belum dimulai';
 return `<div class="c hero"><div class="sub">Futbol Smol Lig</div><h2>Season ${S.n}</h2><p>${S.players.length} pemain · ${st} · ranking ${S.rankOn?'aktif':'nonaktif'}${ref&&!can()?' · mode lihat':''}${h?`<br>Juara bertahan: ${esc(h.res[0])}`:''}</p>
 <div class="acts"><button class="p big nv" onclick="go('${S.fmt==='de'?(S.de?'po':'setup'):S.po?'po':S.sched?'group':'setup'}')">${S.sched||S.de?'Lanjutkan':'Mulai'} Season ${S.n}</button></div></div>`+hofCard()}
function setup(){const c=S.cfg,cf=(k,l)=>`<label>${l}<input type="number" step="any" value="${c[k]}" onchange="set('cfg.${k}',this.value)"></label>`;
 return dt('s1','Pemain',`<label>Jumlah pemain<input type="number" id="pc" min="4" max="20" value="${S.players.length}" onchange="cnt(this.value)"></label><br><textarea id="pl">${esc(S.players.join('\n'))}</textarea><div class="acts" style="margin:0"><button class="p" onclick="applyP()">Terapkan &amp; acak ${S.fmt==='de'?'bracket':'matchday'}</button></div>`,true)
 +dt('s4','Ranking season ini',`<label class="chk"><input type="checkbox" ${S.rankOn?'checked':''} onchange="set('rankOn',this.checked)">Hitung ke ranking pemain</label>`,true)
 +dt('s5','Format season',`<label class="chk"><input type="checkbox" ${S.fmt==='de'?'checked':''} onchange="setFmt(this.checked)">Upper &amp; Lower bracket (tanpa grup)</label>`,true)
 +dt('s2','Poin klasemen grup',`<div class="g">${cf('win','Menang')}${cf('draw','Seri')}</div>`,false)
 +dt('s3','Ranking',`<div class="g">${cf('start','Poin awal')}${cf('iF','Bobot friendly')}${cf('iG','Bobot grup')}${cf('iP','Bobot playoffs')}</div>`,false)
 +`<div class="acts"><button onclick="if(confirm('Reset semua data termasuk Hall of Fame?')){S=DEF();S.op={};save();render()}">Reset</button></div>`}
function cnt(v){v=Math.max(4,Math.min(20,+v||4));const t=$('pl'),a=t.value.split('\n').map(s=>s.trim()).filter(Boolean);while(a.length<v)a.push('Pemain '+(a.length+1));t.value=a.slice(0,v).join('\n');$('pc').value=v}
function applyP(){const p=$('pl').value.split('\n').map(s=>s.trim()).filter(Boolean);
 if(p.length<4){alert('Minimal 4 pemain.');return}if(new Set(p).size!==p.length){alert('Nama pemain harus berbeda.');return}
 if((S.sched||S.de)&&!confirm('Jadwal dan skor season ini akan diacak ulang. Lanjut?'))return;
 S.players=p;S.fr=[];if(S.fmt==='de'){genDE();S.tab='po'}else{gen();S.tab='group'}save();render()}
function group(){if(!S.sched)return `<div class="c pad"><p>Jadwal belum dibuat</p><button class="p" onclick="gen();save();render()">Acak matchday</button></div>`;
 const st=stand(),first=S.sched.findIndex(r=>r.some(m=>m.sa===''||m.sb===''));
 const tbl=`<div class="tw"><table><tr><th>#</th><th>Nama</th><th>M</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
 ${st.map((t,i)=>`<tr class="${i<4?'q':''}"><td>${i+1}</td><td>${N(t.i)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`).join('')}</table></div>`;
 return dt('gs','Klasemen',tbl,true)
 +`<div class="acts"><button onclick="if(confirm('Acak ulang matchday? Skor grup dihapus.')){gen();save();render()}">Acak matchday</button><button onclick="lockAll()">Kunci / buka semua</button><button class="p" onclick="mkPO();S.tab='po';save();render()">Buat playoffs</button></div>`
 +S.sched.map((r,i)=>dt('md'+i,'Matchday '+(i+1)+(lk('md'+i)?' · terkunci':''),r.map((m,j)=>row(m,`sched.${i}.${j}`,0,'md'+i)).join('')+(S.players.length%2?`<p class="mu">Libur: ${N([...Array(S.players.length).keys()].find(x=>!r.some(m=>m.a===x||m.b===x)))}</p>`:'')+lb('md'+i),i===first)).join('')}
function po(){if(S.fmt==='de')return de();if(!S.po)return `<div class="c pad"><p>Playoffs belum dibuat</p><button class="p nv" onclick="go('group')">Ke Grup</button></div>`;
 syncPO(S);const P=S.po,w=win(P.f),th=win(P.t),sec=lose(P.f);
 return dt('p1','Semifinal'+(lk('s')?' · terkunci':''),row(P.s[0],'po.s.0',1,'s')+row(P.s[1],'po.s.1',1,'s')+lb('s'),true)
 +dt('p2','Juara 3'+(lk('t')?' · terkunci':''),row(P.t,'po.t',1,'t')+lb('t'),true)+dt('p3','Final'+(lk('f')?' · terkunci':''),row(P.f,'po.f',1,'f')+lb('f'),true)
 +(w!=null&&th!=null?dt('p4','Hasil akhir',`<div class="m"><span class="t" style="text-align:left">Juara 1</span><b>${N(w)}</b></div><div class="m"><span class="t" style="text-align:left">Juara 2</span><b>${N(sec)}</b></div><div class="m"><span class="t" style="text-align:left">Juara 3</span><b>${N(th)}</b></div><div class="acts"><button class="p" onclick="finish()">Selesaikan season</button></div>`,true):'')
 +`<div class="acts"><button onclick="if(confirm('Buat ulang playoffs dari klasemen?')){mkPO();save();render()}">Buat ulang</button></div>`}
function genDE(){const N=S.players.length;let P=2;while(P<N)P*=2;const R=Math.log2(P);
 let o=[1];while(o.length<P){const n=o.length*2;o=o.flatMap(x=>[x,n+1-x])}
 const ord=shuffle(S.players.map((_,i)=>i)),pl=s=>s<=N?ord[s-1]:null,ms=[],add=(br,r,i,a,b)=>ms.push({id:br+r+'_'+i,br,r,a,b,sa:'',sb:'',pen:''});
 for(let r=1;r<=R;r++)for(let i=0;i<P/2**r;i++)add('W',r,i,r===1?{p:pl(o[2*i])}:{w:'W'+(r-1)+'_'+(2*i)},r===1?{p:pl(o[2*i+1])}:{w:'W'+(r-1)+'_'+(2*i+1)});
 for(let j=1;j<=2*(R-1);j++){const c=P/2**(Math.ceil(j/2)+1);for(let i=0;i<c;i++){
  if(j===1)add('L',j,i,{l:'W1_'+(2*i)},{l:'W1_'+(2*i+1)});
  else if(j%2===0)add('L',j,i,{w:'L'+(j-1)+'_'+i},{l:'W'+(j/2+1)+'_'+(c-1-i)});
  else add('L',j,i,{w:'L'+(j-1)+'_'+(2*i)},{w:'L'+(j-1)+'_'+(2*i+1)})}}
 add('G',1,0,{w:'W'+R+'_0'},{w:'L'+(2*(R-1))+'_0'});
 S.de={ms,R};S.sched=null;S.po=null;S.lk={};S.op={}}
function deEval(z){const M={},memo={};z.de.ms.forEach(m=>M[m.id]=m);
 const sl=s=>s.p!==undefined?s.p:s.w?ev(s.w).w:ev(s.l).l,dp=s=>s.w?ev(s.w).d:s.l?ev(s.l).d:0;
 function ev(id){if(memo[id])return memo[id];const m=M[id],A=sl(m.a),B=sl(m.b);let w,l;
  if(A===undefined||B===undefined){w=l=undefined}
  else if(A===null||B===null){w=A===null?B:A;l=null}
  else if(m.sa===''||m.sb===''){w=l=undefined}
  else{const x=+m.sa,y=+m.sb,aw=x>y?1:x<y?0:m.pen==='a'?1:m.pen==='b'?0:-1;if(aw<0)w=l=undefined;else{w=aw?A:B;l=aw?B:A}}
  return memo[id]={A,B,w,l,d:1+Math.max(dp(m.a),dp(m.b))}}
 return{ev}}
function setFmt(v){if((S.sched||S.de)&&!confirm('Mengganti format menghapus jadwal dan skor season ini. Lanjut?')){render();return}
 S.fmt=v?'de':'grp';S.sched=null;S.po=null;S.de=null;S.lk={};S.op={};save();render()}
function result(){if(S.fmt==='de'&&S.de){const {ev}=deEval(S),g=ev('G1_0'),t=ev('L'+(2*(S.de.R-1))+'_0');return g.w==null||t.l==null?null:[g.w,g.l,t.l]}
 const P=S.po;if(!P)return null;syncPO(S);const c=win(P.f),t=win(P.t);return c==null||t==null?null:[c,lose(P.f),t]}
function de(){if(!S.de)return `<div class="c pad"><p>Bracket belum dibuat</p><button class="p" onclick="genDE();save();render()">Acak bracket</button></div>`;
 const {ev}=deEval(S),R=S.de.R,G={};
 S.de.ms.forEach((m,i)=>{const e=ev(m.id);if(e.A===null||e.B===null)return;const k=m.br+m.r,g=G[k]=G[k]||{m,d:e.d,rows:[]};g.d=Math.min(g.d,e.d);g.rows.push({d:{a:e.A,b:e.B,sa:m.sa,sb:m.sb,pen:m.pen},i,done:e.w!==undefined})});
 const ttl=m=>m.br==='G'?'Grand Final':m.br==='W'?(m.r===R?'Upper Final':R===2?'Play-in':'Upper · Babak '+m.r):(m.r===2*(R-1)?'Lower Final':'Lower · Babak '+m.r);
 const gs=Object.entries(G).sort((a,b)=>a[1].d-b[1].d||(a[0]<b[0]?-1:1)),first=gs.findIndex(([k,g])=>g.rows.some(q=>!q.done&&q.d.a!=null&&q.d.b!=null)),r=result(),m=(l,i)=>`<div class="m"><span class="t" style="text-align:left">${l}</span><b>${N(i)}</b></div>`;
 return gs.map(([k,g],x)=>dt('d'+k,ttl(g.m)+(lk('d'+k)?' · terkunci':''),g.rows.map(q=>row(q.d,`de.ms.${q.i}`,1,'d'+k)).join('')+lb('d'+k),x===first)).join('')
 +(r?dt('p4','Hasil akhir',m('Juara 1',r[0])+m('Juara 2',r[1])+m('Juara 3',r[2])+`<div class="acts"><button class="p" onclick="finish()">Selesaikan season</button></div>`,true):'')
 +`<div class="acts"><button onclick="lockAll()">Kunci / buka semua</button><button onclick="if(confirm('Acak ulang bracket? Skor dihapus.')){genDE();save();render()}">Acak ulang</button></div>`}
function finish(){const r=result();if(!r){alert('Hasil akhir belum lengkap.');return}
 if(!confirm('Selesaikan Season '+S.n+' dan masukkan ke Hall of Fame?'))return;
 S.hist.push({n:S.n,players:S.players,sched:S.sched,po:S.po,de:S.de,fmt:S.fmt,fr:S.fr,rankOn:S.rankOn,res:[S.players[r[0]],S.players[r[1]],S.players[r[2]]],date:new Date().toLocaleDateString('id-ID')});
 S.n++;S.sched=null;S.po=null;S.de=null;S.fmt='grp';S.fr=[];S.lk={};S.rankOn=true;S.op={};S.tab='hof';save();render()}
function akun(){return USER?dt('a1','Akun',`<div class="m"><span class="t" style="text-align:left">${esc(uname(USER))}</span><b>${'Bisa edit'}</b></div><div class="acts"><button class="nv" onclick="logout()">Keluar</button></div>`,true)
 :dt('a1','Login',`<div class="g"><label>Username<input id="le" autocomplete="username" autocapitalize="none"></label><label>Password<input id="lp" type="password" autocomplete="current-password"></label></div><p class="mu" id="lerr" style="color:var(--bad)"></p><div class="acts"><button class="p nv" onclick="login()">Masuk</button></div>`,true)}
const uemail=v=>{v=v.trim().toLowerCase().replace(/\s+/g,'');return v.includes('@')?v:v+'@liga.local'};
function login(){$('lerr').textContent='';firebase.auth().signInWithEmailAndPassword(uemail($('le').value),$('lp').value).then(()=>{S.tab='start';render()}).catch(()=>{$('lerr').textContent='Username atau password salah'})}

function hof(){const H=S.hist.slice().sort((a,b)=>b.n-a.n),cnt={};H.forEach(z=>cnt[z.res[0]]=(cnt[z.res[0]]||0)+1);
 const m=(l,v)=>`<div class="m"><span class="t" style="text-align:left">${l}</span><b>${esc(v)}</b></div>`;
 const names=[...new Set([...S.players,...S.hist.flatMap(z=>z.players)])];
 const add=`<datalist id="dl">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="g"><label>Season ke<input type="number" id="hn" min="1" value="${H.length?H[0].n+1:1}"></label><label>Juara 1<input id="h1" list="dl"></label><label>Juara 2<input id="h2" list="dl"></label><label>Juara 3<input id="h3" list="dl"></label></div><div class="acts" style="margin-bottom:0"><button class="p" onclick="addH()">Simpan</button></div>`;
 return (H.length?dt('hh','Gelar juara',Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([n,c])=>m(esc(n),c+'x')).join(''),true)
 +H.map(z=>dt('h'+z.n,`Season ${z.n} · ${esc(z.res[0])}`,m('Juara 1',z.res[0])+m('Juara 2',z.res[1])+m('Juara 3',z.res[2])+(z.date?m('Selesai',z.date):'')+(z.manual?`<div class="acts" style="margin:6px 0 0"><button onclick="delH(${z.n})">Hapus</button></div>`:`<label class="chk"><input type="checkbox" ${z.rankOn?'checked':''} onchange="trk(${z.n},this.checked)">Ranking aktif</label>`),false)).join(''):(can()?'':'<div class="c pad">Belum ada juara</div>'))
 +(can()?dt('ha','Tambah season lama',add,!H.length):'')}
function addH(){const n=+$('hn').value,r=['h1','h2','h3'].map(i=>$(i).value.trim());
 if(!(n>=1)||r.some(x=>!x)){alert('Isi nomor season dan juara 1 sampai 3.');return}
 if(S.hist.some(z=>z.n===n)){alert('Season '+n+' sudah ada.');return}
 if((S.sched||S.de)&&n>=S.n){alert('Nomor harus lebih kecil dari season yang sedang berjalan.');return}
 S.hist.push({n,players:[],sched:null,po:null,de:null,fmt:'grp',fr:[],rankOn:false,res:r,date:'',manual:true});

function delH(n){if(confirm('Hapus Season '+n+' dari Hall of Fame?')){S.hist=S.hist.filter(z=>z.n!==n);save();render()}}

function fr(){const {log}=ratings(),D=lk('fr')?' disabled':'',opt=s=>S.players.map((n,i)=>`<option value="${i}" ${i==s?'selected':''}>${esc(n)}</option>`).join('');

 return dt('f1','Tambah friendly',`<div class="m"><select id="fa" style="flex:1"${D}>${opt(0)}</select><input id="fsa" type="number" min="0" value="0"${D}><b>:</b><input id="fsb" type="number" min="0" value="0"${D}><select id="fb" style="flex:1"${D}>${opt(1)}</select></div><div class="acts" style="margin-bottom:0"><button class="p" onclick="addF()"${D}>Simpan</button></div>`,true)
 +dt('f2','Riwayat',(L.length?L.map(f=>`<div class="m"><span class="t" style="text-align:left">${N(f.a)} <b>${f.sa}:${f.sb}</b> ${N(f.b)}</span>${f.d?`<span class="${f.d.da>=0?'pos':'neg'}">${sd(f.d.da)}</span>/<span class="${f.d.db>=0?'pos':'neg'}">${sd(f.d.db)}</span>`:''}<button${D} onclick="S.fr.splice(${f.i},1);save();render()">✕</button></div>`).join(''):'<p class="mu">Kosong</p>')+lb('fr'),true)}

if(FB.projectId!=='ISI_DISINI'){try{firebase.initializeApp(FB);ref=firebase.firestore().collection('liga').doc('musim');firebase.auth().onAuthStateChanged(u=>{USER=u;AR=true;if(u&&S.tab==='akun')S.tab='start';render()});
 ref.onSnapshot(d=>{if(d.metadata.hasPendingWrites||!d.exists)return;const tab=S.tab,op=S.op;S=Object.assign(DEF(),JSON.parse(d.data().json),{tab,op});S.cfg=Object.assign(DEF().cfg,S.cfg);render()})}catch(e){}}
