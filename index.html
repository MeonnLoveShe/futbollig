<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Futbol Smol Lig Manager</title>
<style>
:root{--bg:#dfe7f5;--b1:#7aa7ff;--b2:#ff9ec7;--b3:#6fe0c5;--card:rgba(255,255,255,.42);--gb:rgba(255,255,255,.7);--gs:rgba(40,60,110,.16);--tx:#161a22;--mu:#566076;--bd:rgba(90,105,135,.2);--ac:#2563eb;--ok:#15803d;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e16;--b1:#2b4bd6;--b2:#8a2a78;--b3:#127a6b;--card:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16);--gs:rgba(0,0,0,.45);--tx:#eceef2;--mu:#9aa3b5;--bd:rgba(255,255,255,.1);--ac:#6b9bff;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(55% 45% at 12% 8%,var(--b1),transparent 70%),radial-gradient(50% 40% at 92% 22%,var(--b2),transparent 70%),radial-gradient(60% 50% at 65% 98%,var(--b3),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh;color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px}
.w{max-width:760px;margin:auto}h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;padding:5px;border-radius:999px;background:var(--card);border:1px solid var(--gb);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);box-shadow:0 8px 30px var(--gs),inset 0 1px 0 rgba(255,255,255,.5)}.tabs button{border-color:transparent;background:transparent;box-shadow:none;border-radius:999px}.tabs button{flex:none}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--gb);border-radius:12px;padding:7px 11px;backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);transition:background .15s,transform .1s}button:hover{background:rgba(255,255,255,.3)}button:active{transform:scale(.97)}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
button{cursor:pointer}button.on,button.p{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),var(--ac);border-color:rgba(255,255,255,.45);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.35),inset 0 1px 0 rgba(255,255,255,.6)}button.on:hover,button.p:hover{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),var(--ac);filter:brightness(1.08)}
.c{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0) 45%),var(--card);border:1px solid var(--gb);border-radius:22px;padding:0 16px;margin-bottom:12px;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 10px 32px var(--gs),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12)}
details.c>summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.c>summary::-webkit-details-marker{display:none}details.c>summary::after{content:"▾";color:var(--mu);transition:transform .15s}details.c[open]>summary::after{transform:rotate(180deg)}
details.c[open]>summary{border-bottom:1px solid var(--bd);margin-bottom:8px}details.c>div{padding-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}label{display:block;font-size:12px;color:var(--mu)}label input{width:100%;display:block;margin-top:2px}
textarea{width:100%;min-height:110px;margin-bottom:8px}.mu{color:var(--mu);font-size:13px;margin:8px 0 0}
.m{display:flex;align-items:center;gap:6px;padding:6px 0}.m+.m{border-top:1px solid var(--bd)}.m .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.m .t:first-child{text-align:right}
.m input[type=number]{width:54px;text-align:center;padding:6px 4px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--bd)}th:nth-child(2),td:nth-child(2){text-align:left}
tr.q td{background:rgba(37,99,235,.09)}.pos{color:var(--ok)}.neg{color:var(--bad)}.pad{padding:14px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.sw>*{animation:in .5s cubic-bezier(.2,.8,.2,1) both}.sw>*:nth-child(2){animation-delay:.06s}.sw>*:nth-child(3){animation-delay:.12s}.sw>*:nth-child(4){animation-delay:.18s}.sw>*:nth-child(5){animation-delay:.24s}.sw>*:nth-child(n+6){animation-delay:.3s}
.tabs button{transition:background .25s,box-shadow .25s,color .25s,transform .1s}
@media (prefers-reduced-motion:reduce){.sw>*{animation:none}}
body{--card:rgba(255,255,255,.5);--gb:rgba(255,255,255,.8);--gs:rgba(20,20,90,.3);--mu:#3d4560;--row:rgba(255,255,255,.38);background:linear-gradient(160deg,#1f3fff 0%,#7b2ff7 48%,#ff4fa3 100%);background-attachment:fixed}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(60px);pointer-events:none}
body::before{width:60vmax;height:60vmax;left:-20vmax;top:-15vmax;background:#00e0ff;opacity:.55;animation:fl 18s ease-in-out infinite alternate}
body::after{width:55vmax;height:55vmax;right:-20vmax;bottom:-20vmax;background:#ffd23f;opacity:.45;animation:fl 22s ease-in-out infinite alternate-reverse}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,40,.35)}
@media (prefers-color-scheme:dark){body{--card:rgba(18,22,48,.5);--gb:rgba(255,255,255,.2);--gs:rgba(0,0,0,.5);--mu:#a3acc2;--row:rgba(255,255,255,.08);background:linear-gradient(160deg,#08103a 0%,#2a0f55 50%,#4f0f45 100%)}body::before{background:#0891b2;opacity:.4}body::after{background:#c026d3;opacity:.35}}
.c{border-radius:28px;overflow:hidden}
button,select,input{border-radius:999px}
textarea{border-radius:20px;padding:12px 14px}
details.c>summary{padding:14px 2px}details.c[open]>summary{border-bottom:none;margin-bottom:0}
.m{background:var(--row);border-radius:999px;padding:6px 12px;margin-bottom:6px}.m+.m{border-top:none}
.tw{border-radius:20px}table{border-collapse:separate;border-spacing:0 4px}th,td{border-bottom:none}
td:first-child,th:first-child{border-radius:999px 0 0 999px}td:last-child,th:last-child{border-radius:0 999px 999px 0}
tr.q td{background:rgba(37,99,235,.22)}
</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script></head><body><div class="w"><h1>Futbol Smol Lig Manager</h1><div class="tabs" id="tabs"></div><div id="app"></div></div>
<script>
const DEF={players:['Andi','Budi','Citra','Dedi','Eka'],cfg:{win:3,draw:1,start:1000,base:10,dpts:2,loss:5,k:2},sched:null,po:null,fr:[],tab:'setup'};
let S=JSON.parse(JSON.stringify(DEF));
try{const x=localStorage.getItem('fsl1');if(x)S=JSON.parse(x)}catch(e){}
S.op={};
const $=id=>document.getElementById(id);
const FB={apiKey:"AIzaSyDj6mRlOV6dQZaLBnxRmQsEg46DmBKdqnE",authDomain:"futbol-lig-l-tour.firebaseapp.com",projectId:"futbol-lig-l-tour"};
let ref=null;
const save=()=>{try{localStorage.setItem('fsl1',JSON.stringify(S))}catch(e){}
 if(ref){const d={...S};delete d.op;delete d.tab;ref.set({json:JSON.stringify(d),t:Date.now()}).catch(()=>{})}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=i=>esc(S.players[i]??'?');
const sg=n=>(n>0?'+':'')+n;
function dt(key,title,body,def){return `<details class="c" ${(S.op[key]??def)?'open':''} ontoggle="S.op['${key}']=this.open"><summary>${title}</summary><div>${body}</div></details>`}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gen(){let t=shuffle(S.players.map((_,i)=>i));if(t.length%2)t.push(-1);const n=t.length,R=[];
 for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a>=0&&b>=0)m.push({a,b,sa:'',sb:''})}R.push(m);t.splice(1,0,t.pop())}
 S.sched=shuffle(R).map(shuffle);S.po=null;S.op={}}
function stand(){const T=S.players.map((n,i)=>({i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
 (S.sched||[]).flat().forEach(m=>{if(m.sa===''||m.sb==='')return;const a=T[m.a],b=T[m.b],x=+m.sa,y=+m.sb;a.p++;b.p++;a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;
 if(x>y){a.w++;b.l++;a.pts+=S.cfg.win}else if(x<y){b.w++;a.l++;b.pts+=S.cfg.win}else{a.d++;b.d++;a.pts+=S.cfg.draw;b.pts+=S.cfg.draw}});
 return T.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.i-b.i)}
function win(m){if(!m||m.sa===''||m.sb===''||m.a==null||m.b==null)return null;const x=+m.sa,y=+m.sb;return x>y?m.a:x<y?m.b:m.pen==='a'?m.a:m.pen==='b'?m.b:null}
function lose(m){const w=win(m);return w==null?null:w===m.a?m.b:m.a}
function mkPO(){const s=stand().slice(0,4).map(x=>x.i);const e=()=>({sa:'',sb:'',pen:''});
 S.po={s:[{a:s[0],b:s[3],...e()},{a:s[1],b:s[2],...e()}],t:e(),f:e()};S.op={}}
function syncPO(){if(!S.po)return;const P=S.po;P.t.a=lose(P.s[0]);P.t.b=lose(P.s[1]);P.f.a=win(P.s[0]);P.f.b=win(P.s[1])}
function batches(){const B=[];(S.sched||[]).forEach(r=>{const b=r.filter(m=>m.sa!==''&&m.sb!=='').map(m=>({...m,src:'g'}));if(b.length)B.push(b)});
 if(S.po){const P=S.po,ok=m=>m.a!=null&&m.b!=null&&m.sa!==''&&m.sb!=='';
  const s=P.s.filter(ok).map(m=>({...m,src:'p'}));if(s.length)B.push(s);
  const f=[P.t,P.f].filter(ok).map(m=>({...m,src:'p'}));if(f.length)B.push(f)}
 S.fr.forEach((f,i)=>B.push([{...f,src:'f',idx:i}]));return B}
function ratings(){syncPO();const R=S.players.map(()=>S.cfg.start),log=[],c=S.cfg;
 batches().forEach(b=>{const rk=i=>1+R.filter(v=>v>R[i]).length,D=S.players.map(()=>0);
  b.forEach(f=>{const ra=rk(f.a),rb=rk(f.b),x=+f.sa,y=+f.sb;let da,db;
   if(x===y){const h=Math.round(Math.abs(ra-rb)*c.k/2);da=c.dpts+(ra>rb?h:-h);db=c.dpts+(rb>ra?h:-h)}
   else{const aw=x>y,bo=Math.max(0,(aw?ra-rb:rb-ra))*c.k,gw=c.base+bo,gl=-(c.loss+Math.floor(bo/2));da=aw?gw:gl;db=aw?gl:gw}
   D[f.a]+=da;D[f.b]+=db;log.push({...f,ra,rb,da,db})});
  D.forEach((d,i)=>R[i]+=d)});return{R,log}}
function set(path,v){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];const l=k[k.length-1];
 o[l]=path.startsWith('cfg.')?(+v):v;save();render()}
function row(m,p,pen){const tie=pen&&m.sa!==''&&m.sb!==''&&+m.sa===+m.sb;
 return `<div class="m"><span class="t">${m.a==null?'—':N(m.a)}</span><input type="number" min="0" value="${m.sa}" onchange="set('${p}.sa',this.value)"><b>:</b><input type="number" min="0" value="${m.sb}" onchange="set('${p}.sb',this.value)"><span class="t">${m.b==null?'—':N(m.b)}</span>
 ${tie?`<select onchange="set('${p}.pen',this.value)"><option value="">Penalti</option><option value="a" ${m.pen==='a'?'selected':''}>${N(m.a)}</option><option value="b" ${m.pen==='b'?'selected':''}>${N(m.b)}</option></select>`:''}</div>`}
const TABS=[['setup','Setup'],['group','Grup'],['po','Playoffs'],['fr','Friendly'],['rank','Ranking']];
function render(){
 $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';save();render()">${l}</button>`).join('');
 $('app').innerHTML=({setup,group,po,fr,rank})[S.tab]();if(S.tab!==window._lt){window._lt=S.tab;const a=$('app');a.classList.remove('sw');void a.offsetWidth;a.classList.add('sw')}}
function setup(){const c=S.cfg,cf=(k,l)=>`<label>${l}<input type="number" value="${c[k]}" onchange="set('cfg.${k}',this.value)"></label>`;
 const ex=(a,b)=>c.base+Math.max(0,a-b)*c.k;
 return dt('s1','Peserta',`<textarea id="pl">${esc(S.players.join('\n'))}</textarea><div class="acts" style="margin:0"><button class="p" onclick="applyP()">Terapkan &amp; acak matchday</button></div>`,true)
 +dt('s2','Poin klasemen grup',`<div class="g">${cf('win','Menang')}${cf('draw','Seri')}</div>`,false)
 +dt('s3','Poin ranking',`<div class="g">${cf('start','Poin awal')}${cf('base','Menang')}${cf('dpts','Seri')}${cf('loss','Kalah (dikurangi)')}${cf('k','Bonus per selisih rank')}</div><p class="mu">Rank 5 menang lawan rank 1: +${ex(5,1)}</p>`,false)
 +`<div class="acts"><button onclick="if(confirm('Reset semua data?')){S=JSON.parse(JSON.stringify(DEF));S.op={};save();render()}">Reset</button></div>`}
function applyP(){const p=$('pl').value.split('\n').map(s=>s.trim()).filter(Boolean);
 if(p.length<4){alert('Minimal 4 peserta.');return}
 S.players=p;S.fr=S.fr.filter(f=>f.a<p.length&&f.b<p.length);gen();S.tab='group';save();render()}
function group(){if(!S.sched)return `<div class="c pad"><button class="p" onclick="gen();save();render()">Acak matchday</button></div>`;
 const st=stand();let first=S.sched.findIndex(r=>r.some(m=>m.sa===''||m.sb===''));
 const tbl=`<div class="tw"><table><tr><th>#</th><th>Nama</th><th>M</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>
 ${st.map((t,i)=>`<tr class="${i<4?'q':''}"><td>${i+1}</td><td>${N(t.i)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`).join('')}</table></div>`;
 return dt('gs','Klasemen',tbl,true)
 +`<div class="acts"><button onclick="if(confirm('Acak ulang matchday? Skor grup dihapus.')){gen();save();render()}">Acak matchday</button><button class="p" onclick="mkPO();S.tab='po';save();render()">Buat playoffs</button></div>`
 +S.sched.map((r,i)=>dt('md'+i,'Matchday '+(i+1),r.map((m,j)=>row(m,`sched.${i}.${j}`)).join('')+(S.players.length%2?`<p class="mu">Libur: ${N([...Array(S.players.length).keys()].find(x=>!r.some(m=>m.a===x||m.b===x)))}</p>`:''),i===first)).join('')}
function po(){if(!S.po)return `<div class="c pad"><button class="p" onclick="S.tab='group';render()">Ke Grup</button></div>`;
 syncPO();const P=S.po,w=win(P.f),th=win(P.t),sec=lose(P.f);
 return dt('p1','Semifinal',row(P.s[0],'po.s.0',1)+row(P.s[1],'po.s.1',1),true)
 +dt('p2','Juara 3',row(P.t,'po.t',1),true)+dt('p3','Final',row(P.f,'po.f',1),true)
 +(w!=null?dt('p4','Hasil akhir',`<div class="m"><span class="t" style="text-align:left">Juara 1</span><b>${N(w)}</b></div><div class="m"><span class="t" style="text-align:left">Juara 2</span><b>${N(sec)}</b></div>${th!=null?`<div class="m"><span class="t" style="text-align:left">Juara 3</span><b>${N(th)}</b></div>`:''}`,true):'')
 +`<div class="acts"><button onclick="if(confirm('Buat ulang playoffs dari klasemen?')){mkPO();save();render()}">Buat ulang</button></div>`}
function fr(){const {log}=ratings(),L=log.filter(f=>f.src==='f').reverse(),opt=s=>S.players.map((n,i)=>`<option value="${i}" ${i==s?'selected':''}>${esc(n)}</option>`).join('');
 return dt('f1','Tambah friendly',`<div class="m"><select id="fa" style="flex:1">${opt(0)}</select><input id="fsa" type="number" min="0" value="0"><b>:</b><input id="fsb" type="number" min="0" value="0"><select id="fb" style="flex:1">${opt(1)}</select></div><div class="acts" style="margin-bottom:0"><button class="p" onclick="addF()">Simpan</button></div>`,true)
 +dt('f2','Riwayat',L.length?L.map(f=>`<div class="m"><span class="t" style="text-align:left">${N(f.a)} (#${f.ra}) <b>${f.sa}:${f.sb}</b> ${N(f.b)} (#${f.rb})</span><span class="${f.da>=0?'pos':'neg'}">${sg(f.da)}</span>/<span class="${f.db>=0?'pos':'neg'}">${sg(f.db)}</span><button onclick="S.fr.splice(${f.idx},1);save();render()">✕</button></div>`).join(''):'<p class="mu">Kosong</p>',true)}
function addF(){const a=+$('fa').value,b=+$('fb').value;if(a===b){alert('Pilih dua peserta berbeda.');return}
 S.fr.push({a,b,sa:+$('fsa').value||0,sb:+$('fsb').value||0});save();render()}
function rank(){const {R,log}=ratings(),pl=R.map((r,i)=>({i,r,n:log.filter(f=>f.a===i||f.b===i).length})).sort((a,b)=>b.r-a.r||a.i-b.i);
 return dt('r1','Ranking',`<div class="tw"><table><tr><th>#</th><th>Nama</th><th>Poin</th><th>+/-</th><th>Main</th></tr>${pl.map((p,k)=>`<tr><td>${k+1}</td><td>${N(p.i)}</td><td><b>${p.r}</b></td><td class="${p.r>=S.cfg.start?'pos':'neg'}">${sg(p.r-S.cfg.start)}</td><td>${p.n}</td></tr>`).join('')}</table></div>`,true)}
if(FB.projectId!=='ISI_DISINI'){try{firebase.initializeApp(FB);ref=firebase.firestore().collection('liga').doc('main');
 ref.onSnapshot(d=>{if(d.metadata.hasPendingWrites||!d.exists)return;const tab=S.tab,op=S.op;S=Object.assign({},JSON.parse(d.data().json),{tab,op});render()})}catch(e){}}
render();
</script></body></html>
